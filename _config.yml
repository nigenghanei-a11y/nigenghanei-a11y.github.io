# ===== SITE SETTINGS =====
title: "Research Projects"
description: "Research and innovation at the intersection of complexity science, data science, and sustainability"
author: Negin Ghanei
email: your-email@example.com

# ===== URL SETTINGS (FIXED: removed trailing spaces) =====
baseurl: ""
url: "https://nigenghanei-a11y.github.io"

# ===== BUILD SETTINGS =====
markdown: kramdown
highlighter: rouge
theme: null

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# ===== COLLECTIONS (SINGLE BLOCK - DO NOT DUPLICATE) =====
collections:
  # News posts
  posts:
    output: true
    permalink: /news/:year/:month/:day/:title/
  
  # Publications
  publications:
    output: true
    permalink: /publications/:title/
    sort_by: date
    order: descending
  
  # Team members
  team:
    output: true
    permalink: /team/:title/
    sort_by: order
    order: ascending
  
  # Teaching/Student Projects
  teaching:
    output: true
    permalink: /teaching/:title/
    sort_by: date
    order: descending

# ===== DEFAULT LAYOUTS (SINGLE BLOCK - DO NOT DUPLICATE) =====
defaults:
  # Regular pages (index.md, research.md, teaching.md, etc.)
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  
  # News posts (_posts/*.md)
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  
  # Publications (_publications/*.md)
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "publication"
  
  # Team members (_team/*.md)
  - scope:
      path: ""
      type: "team"
    values:
      layout: "team-member"
  
  # Teaching projects (_teaching/*.md)
  - scope:
      path: ""
      type: "teaching"
    values:
      layout: "teaching-project"

# ===== EXCLUDE FROM BUILD =====
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - node_modules/
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/

# ===== OTHER SETTINGS =====
permalink: pretty
timezone: Europe/Berlin