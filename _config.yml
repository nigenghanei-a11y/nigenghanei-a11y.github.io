# ===== SITE SETTINGS =====
title: "Research Projects"
description: "Research and innovation at the intersection of complexity science, data science, and sustainability"
author: Negin Ghanei
email: your-email@example.com

# ===== URL SETTINGS (FIXED: no trailing spaces) =====
baseurl: ""
url: "https://nigenghanei-a11y.github.io"

# ===== BUILD SETTINGS =====
markdown: kramdown
highlighter: rouge
theme: null

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# ===== COLLECTIONS =====
collections:
  posts:
    output: true
    permalink: /news/:year/:month/:day/:title/
  
  publications:
    output: true
    permalink: /publications/:title/
    sort_by: date
    order: descending

# ===== DEFAULT LAYOUTS =====
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "publication"

# ===== EXCLUDE =====
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - node_modules/
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/

permalink: pretty
timezone: Europe/Berlin

# ===== COLLECTIONS =====
collections:
  posts:
    output: true
    permalink: /news/:year/:month/:day/:title/
  
  publications:
    output: true
    permalink: /publications/:title/
    sort_by: date
    order: descending
  
  # ✅ NEW: Team members collection
  team:
    output: true
    permalink: /team/:title/
    sort_by: order
    order: ascending