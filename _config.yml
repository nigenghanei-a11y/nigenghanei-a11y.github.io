# ===== SITE SETTINGS =====
title: "Research Projects"
description: "Research and innovation at the intersection of complexity science, data science, and sustainability"
author: Negin Ghanei
email: your-email@example.com

# ===== URL SETTINGS =====
# For user/organization sites (username.github.io): leave baseurl empty
# For project sites (username.github.io/repo-name): set baseurl to "/repo-name"
baseurl: ""
url: "https://nigenghanei-a11y.github.io"

# ===== BUILD SETTINGS =====
markdown: kramdown
highlighter: rouge
theme: null

# GitHub Pages plugins
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# ===== COLLECTIONS: Auto-generated pages =====
collections:
  # News posts (from _posts folder)
  posts:
    output: true
    permalink: /news/:year/:month/:day/:title/
  
  # Publications (from _publications folder) - NEW
  publications:
    output: true
    permalink: /publications/:title/
    sort_by: date
    order: descending

# ===== DEFAULT LAYOUTS =====
defaults:
  # All regular pages (index.md, research.md, etc.)
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  
  # News posts (_posts/*.md) - CHANGE "post" TO "default" IF YOU WANT SIMPLE LAYOUT
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  
  # Publications (_publications/*.md)
  - scope:
      path: ""
      type: "publications"
    values:
      layout: "publication"

# ===== EXCLUDE FROM BUILD =====
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - node_modules/
  - vendor/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/

# ===== PERMALINK STRUCTURE =====
permalink: pretty

# ===== TIMEZONE =====
timezone: Europe/Berlin