<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="author" content="Negin Ghanei">
  
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  
  <!-- Google Fonts (FIXED: no trailing spaces) -->
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Font Awesome (FIXED: no trailing spaces) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" />

  <!-- Your Stylesheet -->
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  {% include navbar.html %}
  
  {{ content }}

  <!-- D3.js Library (FIXED: no trailing spaces) -->
  <script src="https://d3js.org/d3.v7.min.js"></script>
  
  <!-- Your Script -->
  <script src="{{ '/assets/script.js' | relative_url }}"></script>

<!-- ===== FOOTER ===== -->
<footer class="site-footer" id="contact">
  <div class="footer-container">
    <div class="footer-content">
      <div class="footer-email">
        <i class="fa-solid fa-envelope"></i>
        <a href="mailto:your.email@university.edu">your.email@university.edu</a>
      </div>
      <div class="footer-social">
        <a href="https://github.com/yourusername" target="_blank" rel="noopener" class="social-link github">
          <i class="fa-brands fa-github"></i>
        </a>
        <a href="https://twitter.com/yourusername" target="_blank" rel="noopener" class="social-link twitter">
          <i class="fa-brands fa-twitter"></i>
        </a>
        <a href="https://linkedin.com/in/yourusername" target="_blank" rel="noopener" class="social-link linkedin">
          <i class="fa-brands fa-linkedin"></i>
        </a>
      </div>
    </div>
    <div class="footer-bottom">
      <p>&copy; {{ site.time | date: '%Y' }} {{ site.title }}. All rights reserved.</p>
    </div>
  </div>
</footer>


</body>
</html>
